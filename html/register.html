<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soaminagar Branch Delhi — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=3" />
  <link rel="stylesheet" href="/css/login.css?v=3" />
</head>
<body class="login-body">

  <div class="login-bg">
    <div class="login-bg-circle c1"></div>
    <div class="login-bg-circle c2"></div>
    <div class="login-bg-circle c3"></div>
  </div>

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-brand">
        <h1 class="brand-title">Soaminagar Branch Delhi</h1>
      </div>

      <!-- Toggle -->
      <div class="login-toggle">
        <button class="toggle-btn active" id="btnAdmin" onclick="switchRole('admin')">Admin</button>
        <button class="toggle-btn" id="btnMember" onclick="switchRole('member')">Member</button>
        <span class="toggle-slider" id="toggleSlider"></span>
      </div>

      <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginId">
            <span id="loginLabel">Username / Email</span>
          </label>
          <div class="input-wrap">
            <span class="input-icon">◎</span>
            <input type="text" id="loginId" placeholder="Enter your username" required autocomplete="off" />
          </div>
        </div>

        <div class="form-group">
          <label for="loginPass">Password</label>
          <div class="input-wrap">
            <span class="input-icon">◉</span>
            <input type="password" id="loginPass" placeholder="Enter your password" required />
            <button type="button" class="pass-toggle" onclick="togglePass()">👁</button>
          </div>
        </div>

        <div id="loginError" class="login-error" style="display:none;"></div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-arrow">→</span>
        </button>

        <div class="login-links">
          <a href="#" onclick="showForgotPassword(event)">Forgot Password?</a>
          <span class="link-sep">·</span>
          <a href="#" onclick="showSignup(event)">Create Account</a>
        </div>
      </form>

      <!-- SIGNUP FORM (hidden by default) -->
      <form class="login-form" id="signupForm" style="display:none;" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <div class="input-wrap">
            <span class="input-icon">◎</span>
            <input type="text" id="signupName" placeholder="e.g. Anhad Parashar" required autocomplete="off" />
          </div>
        </div>
        <div class="form-group">
          <label for="signupUsername">Username</label>
          <div class="input-wrap">
            <span class="input-icon">◎</span>
            <input type="text" id="signupUsername" placeholder="e.g. anhad.parashar" required autocomplete="off"
                   oninput="validateUsernameField(this)" />
          </div>
          <p id="signupUsernameHint" class="field-hint" style="display:none"></p>
        </div>
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <div class="input-wrap">
            <span class="input-icon">◎</span>
            <input type="email" id="signupEmail" placeholder="e.g. name@email.com" required autocomplete="email" />
          </div>
        </div>
        <div class="form-group">
          <label for="signupPass">Password</label>
          <div class="input-wrap">
            <span class="input-icon">◉</span>
            <input type="password" id="signupPass" placeholder="At least 6 characters" required minlength="6"
                   oninput="updateSignupStrength(this.value)" autocomplete="new-password" />
            <button type="button" class="pass-toggle" onclick="toggleFieldPass('signupPass',this)" tabindex="-1">👁</button>
          </div>
          <div class="pw-strength-bar" style="display:none" id="signupStrengthBar">
            <div id="signupStrengthFill"></div>
          </div>
          <p id="signupStrengthLabel" class="field-hint" style="display:none"></p>
        </div>
        <div class="form-group">
          <label for="signupConfirm">Confirm Password</label>
          <div class="input-wrap">
            <span class="input-icon">◉</span>
            <input type="password" id="signupConfirm" placeholder="Re-enter your password" required minlength="6"
                   oninput="checkSignupMatch()" autocomplete="new-password" />
            <button type="button" class="pass-toggle" onclick="toggleFieldPass('signupConfirm',this)" tabindex="-1">👁</button>
          </div>
          <p id="signupMatchLabel" class="field-hint" style="display:none"></p>
        </div>

        <div id="signupError" class="login-error" style="display:none;"></div>
        <div id="signupSuccess" class="login-success" style="display:none;"></div>

        <div class="form-group">
          <label class="consent-label" for="signupConsent" style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;color:rgba(255,255,255,0.55);font-size:0.82rem;text-transform:none;letter-spacing:0;font-weight:400;line-height:1.5;">
            <input type="checkbox" id="signupConsent" required style="margin-top:3px;flex-shrink:0;accent-color:var(--clr-saffron);width:15px;height:15px;" />
            <span>I give my consent for my personal data to be stored and used by Soaminagar Branch Delhi for administrative and community purposes only.</span>
          </label>
        </div>

        <button type="submit" class="login-btn" id="signupBtn">
          <span class="btn-spinner" style="display:none">⏳</span>
          <span class="btn-text">Create Account</span>
          <span class="btn-arrow">→</span>
        </button>

        <div class="login-links">
          <a href="#" onclick="showLoginForm(event)">← Back to Sign In</a>
        </div>
      </form>

      <!-- FORGOT PASSWORD FORM (hidden by default) -->
      <form class="login-form" id="forgotForm" style="display:none;" onsubmit="handleForgotPassword(event)">
        <p style="color:rgba(255,255,255,0.5);font-size:0.85rem;margin-bottom:4px;line-height:1.5">
          Enter your username and choose a new password. No email required.
        </p>
        <div class="form-group">
          <label for="forgotUsername">Username</label>
          <div class="input-wrap">
            <span class="input-icon">◎</span>
            <input type="text" id="forgotUsername" placeholder="Enter your username" required autocomplete="username" />
          </div>
        </div>
        <div class="form-group">
          <label for="forgotNewPass">New Password</label>
          <div class="input-wrap">
            <span class="input-icon">◉</span>
            <input type="password" id="forgotNewPass" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" />
            <button type="button" class="pass-toggle" onclick="toggleFieldPass('forgotNewPass',this)" tabindex="-1">👁</button>
          </div>
        </div>
        <div class="form-group">
          <label for="forgotConfirm">Confirm New Password</label>
          <div class="input-wrap">
            <span class="input-icon">◉</span>
            <input type="password" id="forgotConfirm" placeholder="Re-enter new password" required minlength="6" autocomplete="new-password" />
            <button type="button" class="pass-toggle" onclick="toggleFieldPass('forgotConfirm',this)" tabindex="-1">👁</button>
          </div>
        </div>

        <div id="forgotError" class="login-error" style="display:none;"></div>
        <div id="forgotSuccess" class="login-success" style="display:none;"></div>

        <button type="submit" class="login-btn" id="forgotBtn">
          <span class="btn-text">Reset Password</span>
          <span class="btn-arrow">→</span>
        </button>

        <div class="login-links">
          <a href="#" onclick="showLoginForm(event)">← Back to Sign In</a>
        </div>
      </form>

      <div class="login-hint" style="display:none;">
        <p id="loginHint"></p>
      </div>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Signup field helpers (login-page only)
    function toggleFieldPass(id, btn) {
      const inp = document.getElementById(id);
      if (!inp) return;
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.style.opacity = inp.type === 'text' ? '1' : '0.5';
    }
    function validateUsernameField(inp) {
      const hint = document.getElementById('signupUsernameHint');
      if (!hint) return;
      const ok = /^[a-z0-9._]*$/.test(inp.value);
      hint.style.display = inp.value && !ok ? 'block' : 'none';
      hint.textContent = 'Only lowercase letters, numbers, dots and underscores allowed.';
      hint.style.color = '#ff8b94';
    }
    function updateSignupStrength(val) {
      const bar   = document.getElementById('signupStrengthBar');
      const fill  = document.getElementById('signupStrengthFill');
      const label = document.getElementById('signupStrengthLabel');
      if (!bar) return;
      if (!val) { bar.style.display = 'none'; label.style.display = 'none'; return; }
      bar.style.display = 'block'; label.style.display = 'block';
      let score = 0;
      if (val.length >= 6)  score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const levels = [
        { pct:'20%', color:'#ef4444', text:'Very weak' },
        { pct:'40%', color:'#f97316', text:'Weak' },
        { pct:'60%', color:'#eab308', text:'Fair' },
        { pct:'80%', color:'#22c55e', text:'Strong' },
        { pct:'100%',color:'#16a34a', text:'Very strong' },
      ];
      const lv = levels[Math.max(0, score - 1)] || levels[0];
      fill.style.width = lv.pct;
      fill.style.background = lv.color;
      label.textContent = lv.text;
      label.style.color = lv.color;
    }
    function checkSignupMatch() {
      const nw  = document.getElementById('signupPass')?.value || '';
      const cfg = document.getElementById('signupConfirm')?.value || '';
      const lbl = document.getElementById('signupMatchLabel');
      if (!lbl || !cfg) { if (lbl) lbl.style.display='none'; return; }
      lbl.style.display = 'block';
      lbl.textContent  = nw === cfg ? '✓ Passwords match' : '✗ Passwords do not match';
      lbl.style.color  = nw === cfg ? '#6ee7a0' : '#ff8b94';
    }
  </script>
</body>
</html>
