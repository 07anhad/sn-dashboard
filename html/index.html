<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soaminagar Branch Delhi — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/login.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#e07b29" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
</head>
<body class="login-body">

  <div class="login-bg">
    <div class="login-bg-circle c1"></div>
    <div class="login-bg-circle c2"></div>
    <div class="login-bg-circle c3"></div>
  </div>

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-brand">
        <h1 class="brand-title">Soaminagar Branch Delhi</h1>
      </div>

      <!-- Toggle -->
      <div class="login-toggle">
        <button class="toggle-btn active" id="btnAdmin" onclick="switchRole('admin')">Admin</button>
        <button class="toggle-btn" id="btnMember" onclick="switchRole('member')">Member</button>
        <span class="toggle-slider" id="toggleSlider"></span>
      </div>

      <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginId">
            <span id="loginLabel">Username / Email</span>
          </label>
          <div class="input-wrap">
            <span class="input-icon">◎</span>
            <input type="text" id="loginId" placeholder="Enter your username" required autocomplete="off" />
          </div>
        </div>

        <div class="form-group">
          <label for="loginPass">Password</label>
          <div class="input-wrap">
            <span class="input-icon">◉</span>
            <input type="password" id="loginPass" placeholder="Enter your password" required />
            <button type="button" class="pass-toggle" onclick="togglePass()">👁</button>
          </div>
        </div>

        <div id="loginError" class="login-error" style="display:none;"></div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-arrow">→</span>
        </button>

        <div class="login-links">
          <a href="#" onclick="showForgotPassword(event)">Forgot Password?</a>
          <span class="link-sep">·</span>
          <a href="#" onclick="showSignup(event)">Create Account</a>
        </div>
      </form>

      <!-- OTP VERIFICATION STEP (hidden by default) -->
      <div class="login-form" id="otpForm" style="display:none;">
        <div style="text-align:center;margin-bottom:20px">
          <div style="font-size:2rem;margin-bottom:8px">📧</div>
          <div style="color:rgba(255,255,255,0.9);font-size:0.95rem;font-weight:600;margin-bottom:6px">Check your email</div>
          <div style="color:rgba(255,255,255,0.55);font-size:0.82rem">A 6-digit code was sent to<br><span id="otpMaskedEmail" style="color:rgba(255,255,255,0.8);font-weight:600"></span></div>
        </div>
        <div class="form-group">
          <label for="otpCode">Enter 6-digit code</label>
          <div class="input-wrap">
            <span class="input-icon">◉</span>
            <input type="text" id="otpCode" placeholder="e.g. 483920" maxlength="6"
                   inputmode="numeric" autocomplete="one-time-code"
                   style="letter-spacing:8px;font-size:1.2rem;text-align:center"
                   oninput="this.value=this.value.replace(/\D/g,'')" />
          </div>
        </div>
        <div id="otpError" class="login-error" style="display:none;"></div>
        <button type="button" class="login-btn" id="otpVerifyBtn" onclick="handleVerifyOtp()">
          <span class="btn-text">Verify & Sign In</span>
          <span class="btn-arrow">→</span>
        </button>
        <div class="login-links" style="margin-top:16px">
          <a href="#" onclick="handleResendOtp(event)">Resend code</a>
          <span class="link-sep">·</span>
          <a href="#" onclick="showLoginForm(event)">← Back</a>
        </div>
      </div>

      <!-- SIGNUP FORM (hidden by default) -->
      <form class="login-form" id="signupForm" style="display:none;" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <div class="input-wrap">
            <span class="input-icon">◎</span>
            <input type="text" id="signupName" placeholder="e.g. Anhad Parashar" required autocomplete="off" />
          </div>
        </div>
        <div class="form-group">
          <label for="signupUsername">Username</label>
          <div class="input-wrap">
            <span class="input-icon">◎</span>
            <input type="text" id="signupUsername" placeholder="e.g. anhad.parashar" required autocomplete="off" />
          </div>
        </div>
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <div class="input-wrap">
            <span class="input-icon">◎</span>
            <input type="email" id="signupEmail" placeholder="e.g. name@email.com" required autocomplete="off" />
          </div>
        </div>
        <div class="form-group">
          <label for="signupPass">Password</label>
          <div class="input-wrap">
            <span class="input-icon">◉</span>
            <input type="password" id="signupPass" placeholder="Choose a password" required minlength="6" />
          </div>
        </div>
        <div class="form-group">
          <label for="signupConfirm">Confirm Password</label>
          <div class="input-wrap">
            <span class="input-icon">◉</span>
            <input type="password" id="signupConfirm" placeholder="Re-enter your password" required minlength="6" />
          </div>
        </div>

        <div id="signupError" class="login-error" style="display:none;"></div>
        <div id="signupSuccess" class="login-success" style="display:none;"></div>

        <div class="form-group">
          <label class="consent-label" for="signupConsent" style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;color:rgba(255,255,255,0.55);font-size:0.82rem;text-transform:none;letter-spacing:0;font-weight:400;line-height:1.5;">
            <input type="checkbox" id="signupConsent" required style="margin-top:3px;flex-shrink:0;accent-color:var(--clr-saffron);width:15px;height:15px;" />
            <span>I give my consent for my personal data to be stored and used by Soaminagar Branch Delhi for administrative and community purposes only.</span>
          </label>
        </div>

        <button type="submit" class="login-btn" id="signupBtn">
          <span class="btn-text">Create Account</span>
          <span class="btn-arrow">→</span>
        </button>

        <div class="login-links">
          <a href="#" onclick="showLoginForm(event)">← Back to Sign In</a>
        </div>
      </form>

      <!-- FORGOT PASSWORD FORM (hidden by default) --> 
      <form class="login-form" id="forgotForm" style="display:none;" onsubmit="handleForgotStep1(event)">
        <div class="form-group">
          <label for="forgotUsername">Username</label>
          <div class="input-wrap">
            <span class="input-icon">◎</span>
            <input type="text" id="forgotUsername" placeholder="Enter your username" required autocomplete="off" />
          </div>
        </div>

        <div id="forgotError" class="login-error" style="display:none;"></div>
        <div id="forgotSuccess" class="login-success" style="display:none;"></div>

        <button type="submit" class="login-btn" id="forgotBtn">
          <span class="btn-text">Send OTP</span>
          <span class="btn-arrow">→</span>
        </button>
        <div class="login-links">
          <a href="#" onclick="showLoginForm(event)">← Back to Sign In</a>
        </div>
      </form>

      <!-- FORGOT PASSWORD STEP 2: OTP + new password -->
      <div class="login-form" id="forgotOtpForm" style="display:none;">
        <div style="text-align:center;margin-bottom:20px">
          <div style="font-size:2rem;margin-bottom:8px">📧</div>
          <div style="color:rgba(255,255,255,0.9);font-size:0.95rem;font-weight:600;margin-bottom:6px">Verify your identity</div>
          <div style="color:rgba(255,255,255,0.55);font-size:0.82rem">Code sent to <span id="forgotMaskedEmail" style="color:rgba(255,255,255,0.8);font-weight:600"></span></div>
        </div>
        <div class="form-group">
          <label for="forgotOtpCode">6-digit code</label>
          <div class="input-wrap">
            <span class="input-icon">◉</span>
            <input type="text" id="forgotOtpCode" placeholder="e.g. 483920" maxlength="6"
                   inputmode="numeric" autocomplete="one-time-code"
                   style="letter-spacing:8px;font-size:1.2rem;text-align:center"
                   oninput="this.value=this.value.replace(/\D/g,'')" />
          </div>
        </div>
        <div class="form-group">
          <label for="forgotNewPass">New Password</label>
          <div class="input-wrap">
            <span class="input-icon">◉</span>
            <input type="password" id="forgotNewPass" placeholder="New password" minlength="6" />
          </div>
        </div>
        <div class="form-group">
          <label for="forgotConfirm">Confirm New Password</label>
          <div class="input-wrap">
            <span class="input-icon">◉</span>
            <input type="password" id="forgotConfirm" placeholder="Re-enter new password" minlength="6" />
          </div>
        </div>
        <div id="forgotOtpError" class="login-error" style="display:none;"></div>
        <button type="button" class="login-btn" id="forgotOtpBtn" onclick="handleForgotStep2()">
          <span class="btn-text">Reset Password</span>
          <span class="btn-arrow">→</span>
        </button>
        <div class="login-links">
          <a href="#" onclick="handleForgotResend(event)">Resend code</a>
          <span class="link-sep">·</span>
          <a href="#" onclick="showForgotPassword(event)">← Back</a>
        </div>
      </div>

      <div class="login-hint" style="display:none;">
        <p id="loginHint"></p>
      </div>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
    }
  </script>
</body>
</html>
